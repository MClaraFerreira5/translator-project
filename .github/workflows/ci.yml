name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y g++ cmake make flex bison m4 python3
      - name: Compilar e testar
        run: sh scripts/build-e-testes.sh
